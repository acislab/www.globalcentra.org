layout: default
---
<div class="container">
<article {% if page.feature-img %}class="feature-image"{% endif %}>
  <header style="padding: 0px">

  </header>
  
  <section class="post-content">{% include centra2combinedmenu.html %}{{ content }}</section>
</article>
</div>
